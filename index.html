<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knack den Code</title>
  <style>
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#111,#222,#000);display:flex;justify-content:center;align-items:center}
    .game{text-align:center;background:rgba(0,0,0,.6);padding:28px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.8);transition:.2s;max-width:420px;width:92vw}
    .game.flash-red{animation:redFlash .45s ease 3}
    @keyframes redFlash{0%,100%{background:rgba(0,0,0,.6);box-shadow:0 20px 60px rgba(0,0,0,.8)}50%{background:rgba(120,0,0,.85);box-shadow:0 0 35px rgba(255,0,0,.95)}}
    h1{font-size:3rem;margin:0 0 5px}
    .subtitle{color:#ccc;margin-bottom:12px}
    .timer{display:inline-block;font-size:2.2rem;font-weight:700;color:#ffd36b;background:rgba(0,0,0,.45);padding:8px 18px;border-radius:16px;margin-bottom:16px;border:2px solid rgba(255,211,107,.45);min-width:110px}
    .timer.danger{color:#ff6b6b;border-color:rgba(255,0,0,.6);animation:timerPulse .7s infinite}
    @keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

    .lock-wrap{display:flex;justify-content:center;align-items:center;margin:6px 0 10px}
    svg{width:185px;height:auto;overflow:visible}
 
    /* Realistischeres Öffnen: Der komplette Bügel hebt sich erst an und kippt dann leicht weg. */
    .shackle{transition:transform .9s ease;transform-origin:30px 78px}
    .open .shackle{transform:rotate(-45deg) translate(-5px,-5px)}

    .inputs{display:flex;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}
    input{width:62px;height:62px;font-size:1.55rem;text-align:center;border-radius:12px;border:3px solid transparent;font-weight:700}
    input:focus{outline:none;border-color:orange}
    button{padding:12px 26px;font-size:1.05rem;border-radius:24px;border:none;background:orange;cursor:pointer;font-weight:700}
    button:disabled,input:disabled{opacity:.6;cursor:not-allowed}
    .message{margin-top:12px;font-weight:700;min-height:22px}
    .success{color:#9cff9c}.error{color:#ff6b6b}
  </style>
</head>
<body>

<div class="game" id="game">
  <h1>Knack den Code</h1>
  <div class="subtitle">Gib den richtigen Code ein</div>
  <div class="timer" id="timer">01:00</div>

  <div class="lock-wrap">
    <svg viewBox="0 0 120 160" id="lockSvg" aria-label="Schloss">
      <!-- kompletter Bügel: beide Seiten bewegen sich gemeinsam nach oben -->
      <g class="shackle">
        <path d="M30 78 V45 a30 30 0 0 1 60 0 V78" fill="none" stroke="#bfbfbf" stroke-width="10" stroke-linecap="round"/>
        <path d="M38 77 V47 a22 22 0 0 1 44 0 V77" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Schlosskörper -->
      <rect x="20" y="70" width="80" height="70" rx="12" fill="#caa24a" stroke="#6b4a1a" stroke-width="3"/>
      <rect x="24" y="74" width="72" height="18" rx="8" fill="rgba(255,255,255,.25)"/>
      <rect x="23" y="98" width="74" height="35" rx="8" fill="rgba(80,45,0,.12)"/>

      <!-- Schlüsselloch -->
      <circle cx="60" cy="100" r="8" fill="#1a1a1a"/>
      <rect x="56" y="108" width="8" height="16" rx="3" fill="#1a1a1a"/>
    </svg>
  </div>

  <div class="inputs">
    <input maxlength="2" inputmode="text" aria-label="Codezahl 1" />
    <input maxlength="2" inputmode="text" aria-label="Codezahl 2" />
    <input maxlength="2" inputmode="text" aria-label="Codezahl 3" />
    <input maxlength="2" inputmode="text" aria-label="Codezahl 4" />
  </div>

  <button id="checkButton" onclick="checkCode()">Prüfen</button>
  <div class="message" id="message"></div>
</div>

<script>
  const correctCode = ["9","-5","1","-4"];
  let timeLeft = 60;
  let gameFinished = false;

  const timerEl = document.getElementById('timer');
  const message = document.getElementById('message');
  const game = document.getElementById('game');
  const lockSvg = document.getElementById('lockSvg');
  const button = document.getElementById('checkButton');
  const inputs = Array.from(document.querySelectorAll('input'));

  const countdown = setInterval(() => {
    if (gameFinished) return;

    timeLeft--;
    updateTimer();

    if (timeLeft <= 10) timerEl.classList.add('danger');

    if (timeLeft <= 0) {
      clearInterval(countdown);
      gameFinished = true;
      message.textContent = 'Die Zeit ist abgelaufen!';
      message.className = 'message error';
      button.disabled = true;
      inputs.forEach(i => i.disabled = true);
      flashRed();
    }
  }, 1000);

  function updateTimer() {
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  inputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9-]/g, '');
      if (input.value.length >= input.maxLength && idx < inputs.length - 1) {
        inputs[idx + 1].focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkCode();
      if (e.key === 'Backspace' && input.value === '' && idx > 0) {
        inputs[idx - 1].focus();
      }
    });
  });

  function checkCode() {
    if (gameFinished) return;

    const values = inputs.map(i => i.value.trim());

    if (values.join(',') === correctCode.join(',')) {
      gameFinished = true;
      clearInterval(countdown);
      lockSvg.classList.add('open');
      message.textContent = 'Richtig! Das Schloss öffnet sich!';
      message.className = 'message success';
      button.disabled = true;
      inputs.forEach(i => i.disabled = true);
    } else {
      message.textContent = 'Falsch! Überprüft eure Lösungen.';
      message.className = 'message error';
      flashRed();
    }
  }

  function flashRed() {
    game.classList.remove('flash-red');
    void game.offsetWidth;
    game.classList.add('flash-red');
  }
</script>

</body>
</html>
